---
name: upstream-sync

on:
  schedule:
    # every monday at 04:17 UTC, before the renovate run
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/E4-Computer-Engineering/nvme-exporter.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # "ours" is not a builtin merge driver (only text/binary/union are):
          # without this config the merge=ours entries in .gitattributes are
          # inert. `true` exits 0 and leaves %A untouched, i.e. keeps our side.
          # Upstream improvements to those CI files are deliberately dropped -
          # the fork owns them and renovate keeps them fresh.
          git config merge.ours.driver true

      - name: Fetch upstream
        run: |
          git remote add upstream "${UPSTREAM_URL}" 2>/dev/null \
            || git remote set-url upstream "${UPSTREAM_URL}"
          git fetch --no-tags upstream \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

      - name: Merge upstream into main
        id: merge
        run: |
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "main already contains upstream/${UPSTREAM_BRANCH}, nothing to do"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! git merge --no-ff --no-edit \
              -m "chore: merge upstream ${UPSTREAM_BRANCH}" \
              "upstream/${UPSTREAM_BRANCH}"; then
            # capture the unmerged paths before aborting - the abort wipes the
            # index state they are read from
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -n "${conflicts}" ]; then
              echo "${conflicts}" | sed 's/^/conflicting file: /'
              delimiter="EOF_${RANDOM}${RANDOM}"
              {
                echo "conflict=true"
                echo "conflicts<<${delimiter}"
                echo "${conflicts}"
                echo "${delimiter}"
              } >> "${GITHUB_OUTPUT}"
            fi
            echo "::error title=upstream merge conflict::cannot merge upstream/${UPSTREAM_BRANCH} into main automatically, resolve it by hand"
            git merge --abort || true
            exit 1
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      # a conflicted sync needs a human, and a red run in the actions tab is easy
      # to miss on a weekly cron. Mirror it into an issue, reusing the open one
      # if a previous run already filed it instead of piling up duplicates.
      - name: Report conflict as an issue
        if: failure() && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: upstream sync conflict
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$(
            printf 'Automatic merge of `upstream/%s` into `main` hit conflicts and was aborted.\n\n' "${UPSTREAM_BRANCH}"
            printf 'Conflicting files:\n\n'
            printf '%s\n' "${CONFLICTS}" | sed 's/^/- `/;s/$/`/'
            printf '\nFailed run: %s\n\n' "${RUN_URL}"
            printf 'Resolve it locally:\n\n'
            printf '```sh\n'
            printf 'git remote add upstream %s\n' "${UPSTREAM_URL}"
            printf 'git fetch upstream %s\n' "${UPSTREAM_BRANCH}"
            printf 'git config merge.ours.driver true  # makes .gitattributes merge=ours effective\n'
            printf 'git merge upstream/%s\n' "${UPSTREAM_BRANCH}"
            printf '```\n'
          )"
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${ISSUE_TITLE}\")) | first | .number // empty")"
          if [ -n "${number}" ]; then
            echo "conflict already tracked, commenting on issue #${number}"
            gh issue comment "${number}" --body "${body}"
          else
            echo "no open conflict issue, creating one"
            gh issue create --title "${ISSUE_TITLE}" --body "${body}"
          fi

      - name: Push merge to main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      # pushes made with GITHUB_TOKEN do not trigger `push` workflows, so the
      # build has to be dispatched explicitly (workflow_dispatch is exempt from
      # the recursion guard)
      - name: Trigger build workflow
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
